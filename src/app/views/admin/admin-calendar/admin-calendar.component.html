<main class="cal-main">
  <div class="d-lg-none" style="height:70px;"></div>

  <div class="cal-page-header">
    <div>
      <h1 class="cal-title">Sessions Calendar</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/admin">Home</a></li>
          <li class="breadcrumb-item active">Calendar</li>
        </ol>
      </nav>
    </div>
    <a routerLink="/admin/sessionform" class="btn-new-session">
      <i class="bi bi-plus-lg"></i> New Session
    </a>
  </div>

  <div class="cal-embed-card">
    <iframe [src]="embedUrl" style="border:0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
  </div>
</main>
