<main id="main">
  <div class="d-lg-none d-md-block"><br /><br /><br /></div>

  <div class="sf-page-header">
    <div>
      <h1 class="sf-title">Sessions Calendar</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a routerLink="/admin">Home</a></li>
          <li class="breadcrumb-item active">Session Management</li>
        </ol>
      </nav>
    </div>
    <button class="btn-add-session" (click)="openSessionDialog()">
      <i class="bi bi-plus-lg me-1"></i> New Session
    </button>
  </div>

  <!-- Google Calendar embed -->
  <div class="cal-embed-card">
    <iframe [src]="embedUrl" style="border:0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
  </div>

  <!-- ═══ SESSION DIALOG ═══ -->
  <div class="ses-overlay" *ngIf="showDialog" (click)="closeAll()">
    <div class="ses-modal" (click)="$event.stopPropagation()">

      <!-- Step indicator -->
      <div class="ses-steps">
        <div class="ses-step" [class.active]="dialogStep===1" [class.done]="dialogStep>1">
          <div class="ses-step-num">1</div><span>Session Info</span>
        </div>
        <div class="ses-step-line" [class.done]="dialogStep>1"></div>
        <div class="ses-step" [class.active]="dialogStep===2">
          <div class="ses-step-num">2</div><span>Assign Groups</span>
        </div>
      </div>

      <!-- Step 1 -->
      <div *ngIf="dialogStep===1">
        <h5 class="ses-modal-title">New Session</h5>

        <div class="ses-field">
          <label>Training *</label>
          <select class="form-select" [(ngModel)]="selectedTraining">
            <option *ngFor="let f of formations" [value]="f.id">{{ f.nomFormation }}</option>
          </select>
        </div>

        <div class="ses-row">
          <div class="ses-field">
            <label>Date *</label>
            <input type="date" class="form-control" [(ngModel)]="sessionDate" [min]="today">
          </div>
          <div class="ses-field">
            <label>Start Time *</label>
            <input type="time" class="form-control" [(ngModel)]="sessionTime">
          </div>
        </div>

        <div class="ses-row">
          <div class="ses-field">
            <label>Duration (hours) *</label>
            <input type="number" class="form-control" [(ngModel)]="sessionDuration" min="1" placeholder="2">
          </div>
          <div class="ses-field">
            <label>Coach <span class="text-muted">(optional — filters groups)</span></label>
            <select class="form-select" [(ngModel)]="selectedFormateurId">
              <option [value]="null">All coaches</option>
              <option *ngFor="let f of formateurs" [value]="f.id">{{ getFormateurName(f) }}</option>
            </select>
          </div>
        </div>

        <div class="ses-field">
          <label>Session Name *</label>
          <input class="form-control" [(ngModel)]="sessionName" placeholder="e.g. Morning Session">
        </div>

        <div class="ses-field">
          <label>Description *</label>
          <textarea class="form-control" rows="2" [(ngModel)]="sessionDescription" placeholder="Brief description…"></textarea>
        </div>

        <div class="ses-actions">
          <button class="btn-ses-cancel" (click)="closeAll()">Cancel</button>
          <button class="btn-ses-next" (click)="goToStep2()">
            Next <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </div>
      </div>

      <!-- Step 2 -->
      <div *ngIf="dialogStep===2">
        <h5 class="ses-modal-title">Assign Groups</h5>
        <p class="ses-modal-sub">Training: <strong>{{ getSelectedTrainingName() }}</strong></p>

        <div class="groups-list" *ngIf="groups.length; else noGroups">
          <label class="group-item" *ngFor="let group of groups"
                 [class.checked]="isGroupSelected(group)"
                 (click)="selectGroup(group)">
            <div class="group-check">
              <i class="bi" [class.bi-check-circle-fill]="isGroupSelected(group)" [class.bi-circle]="!isGroupSelected(group)"></i>
            </div>
            <div>
              <div>{{ group.groupName }}</div>
              <small class="text-muted" *ngIf="group.formateur">
                <i class="bi bi-person me-1"></i>{{ group.formateur.firstName }} {{ group.formateur.lastName }}
              </small>
            </div>
          </label>
        </div>
        <ng-template #noGroups>
          <div class="no-sessions"><i class="bi bi-people-fill"></i><span>No groups found for this training{{ selectedFormateurId ? ' and coach' : '' }}</span></div>
        </ng-template>

        <div class="ses-actions">
          <button class="btn-ses-cancel" (click)="dialogStep=1">
            <i class="bi bi-arrow-left me-1"></i> Back
          </button>
          <button class="btn-ses-primary" (click)="createSession()" [disabled]="selectedGroups.length===0 || isCreating">
            <span *ngIf="isCreating" class="spinner-border spinner-border-sm me-1"></span>
            <i *ngIf="!isCreating" class="bi bi-check-lg me-1"></i>
            Create Session
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Delete confirm dialog -->
  <div class="ses-overlay" *ngIf="showDeleteConfirm" (click)="showDeleteConfirm=false">
    <div class="ses-modal ses-modal--sm" (click)="$event.stopPropagation()">
      <h5 class="ses-modal-title text-danger"><i class="bi bi-trash3 me-2"></i>Delete Session</h5>
      <p class="text-muted">Are you sure?</p>
      <div class="ses-actions">
        <button class="btn-ses-cancel" (click)="showDeleteConfirm=false">Cancel</button>
      </div>
    </div>
  </div>

</main>
